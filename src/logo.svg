<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">

    <!-- Background Circle -->
    <circle cx="200" cy="200" r="180" fill="#ffffff" />

    <!-- Flames -->
    <path d="M 200 50 Q 150 150 200 250 Q 250 150 200 50 Z" fill="#ff4500" />
    <path d="M 120 200 Q 200 300 280 200 Q 200 150 120 200 Z" fill="#ff4500" />
    <path d="M 80 130 Q 200 230 320 130 Q 200 100 80 130 Z" fill="#ff4500" />

    <!-- Stopwatch Body -->
    <circle cx="200" cy="200" r="80" fill="#000000" />

    <!-- Stopwatch Face -->
    <circle cx="200" cy="200" r="75" fill="#ffffff" />

    <!-- Stopwatch Hands -->
    <line x1="200" y1="200" x2="200" y2="150" stroke="#000000" stroke-width="5" />
    <line x1="200" y1="200" x2="250" y2="140" stroke="#000000" stroke-width="5" />

    <!-- Progress Bar -->
    <circle cx="200" cy="200" r="70" fill="none" stroke="#000000" stroke-width="10" stroke-dasharray="440" stroke-dashoffset="176" />

    <!-- Text -->
    <text x="200" y="310" font-family="Arial" font-size="24" fill="#000000" text-anchor="middle">7 min robot</text>

</svg>